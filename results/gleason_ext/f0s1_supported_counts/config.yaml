run_name: f0s1_supported_counts
results_root: results/gleason_ext
overwrite: false
seed: 1
device: cuda
amp: bf16
method: hsrl
data:
  dataset: gleason
  processed_root: data/processed/gleason
  tile_size: 512
  benign_rule: drop
  exclude_readers: []
  fold: 0
  vote_mode: counts_only
  vote_seed: 1
  include_ties: false
  unlabelled_pool: filtered
  subset: null
  num_workers: 4
model:
  backbone: efficientnet_b2
  pretrained: true
  proj_hidden: null
  proj_dim: 128
augment:
  hflip: 0.5
  vflip: 0.5
  rotation: rot90
  rotation_p: 0.5
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
stage1:
  enabled: true
  epochs: 30
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 32
  loss: supported
  alpha: 1.0
  beta: 0.5
  gamma: 0.5
  terms:
  - 1
  - 2
  - 3
  conf_rule: second_nearest
  log_tuples: true
stage2:
  epochs: 5
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 32
  targets: soft
stage3:
  epochs: 10
  lr: 1.0e-05
  weight_decay: 0.0001
  batch_size: 32
  tau: 0.85
  refresh_every_epoch: false
  labelled_targets: hard
supervised:
  epochs: 35
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 32
  targets: hard
monitor:
  n_val: 512
  k: 5
eval:
  splits:
  - val
  - test
  save_embeddings: true
